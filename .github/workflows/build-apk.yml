name: Build & Release Qwen Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/QwenBridge-release.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenBridge-APK
          path: build-output/QwenBridge-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "Qwen Bridge v1.1.0 (Multimodal Vision, Media Studio & Deep Log Inspection)"
          body: |
            ### 🌉 Qwen Bridge Mobile App v1.1.0

            #### 🚀 New Features in v1.1.0:
            - **Deep In/Out Log Inspection**: Tap any request in the Logs tab to view full formatted Request URL, Method, Headers, Request Body, Response Headers, and Response Body with one-tap clipboard copy.
            - **Image & Video Generation Endpoints**: Full OpenAI-compatible support for `POST /v1/images/generations` (`qwen-image`) and `POST /v1/videos/generations` (`qwen-video`), auto-saving outputs to `/storage/emulated/0/Documents/Qwen/`.
            - **AI Media Studio Tab**: Native Compose UI for generating and previewing images and videos directly on your device.
            - **Multimodal Vision & File Attachments**: Added direct file/photo picker to attach images and documents to your chat prompts with automatic Base64 encoding.
          files: build-output/QwenBridge-release.apk
